name: Release

# Tworzy wydanie GitHub, gdy w manifest.json pojawi się nowa wersja.
# Opis wydania pochodzi z odpowiedniej sekcji CHANGELOG.md.

on:
  push:
    branches: [main]
    paths:
      - custom_components/moya_promo/manifest.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Odczyt wersji
        id: version
        run: echo "version=$(jq -r .version custom_components/moya_promo/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Utworzenie wydania (jeśli go jeszcze nie ma)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Wydanie $TAG już istnieje – pomijam."
            exit 0
          fi
          awk -v ver="$VERSION" '
            /^## / { if (p) exit; if (index($0, "## " ver) == 1) { p = 1; next } }
            p
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Wydanie $TAG" > notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --latest
